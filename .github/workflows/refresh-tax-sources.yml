name: Refresh tax sources
on:
  schedule:
    - cron: "17 5 * * 1"      # every Monday
    - cron: "17 6 2-8 1 *"    # extra pass in the first week of January (new-year figures)
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Refresh statutes and BMF texts
        working-directory: .claude/skills/de-freelancer-tax/tools
        run: python3 refresh.py --apply | tee /tmp/refresh-report.txt
      - name: Canary rules and tests
        working-directory: .claude/skills/de-freelancer-tax/tools
        run: |
          python3 check_rules.py | tee /tmp/rules-report.txt || true
          python3 -m unittest 2>&1 | tail -5 | tee /tmp/test-report.txt || true
      - name: Open PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          if git diff --cached --quiet -- . ':!.claude/skills/de-freelancer-tax/references/fetched.json'; then echo "no legal changes"; exit 0; fi
          BR="auto/refresh-$(date +%Y%m%d)"
          git config user.name "tax-suite-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout -b "$BR"; git commit -m "Refresh legal sources $(date +%F)"; git push origin "$BR"
          { echo "Automatic refresh of statutes and BMF texts."; echo; echo '```'; cat /tmp/refresh-report.txt /tmp/rules-report.txt /tmp/test-report.txt; echo '```'; echo; echo "Review every changed section, update playbooks/rules.json where a rule changed, then merge."; } > /tmp/body.md
          gh pr create --title "Legal sources refreshed $(date +%F)" --body-file /tmp/body.md
